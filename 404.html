<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>404 - StacklyEstate</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#0f172a;
}

/* =========================
   BACKGROUND IMAGE
========================= */

body::before{
  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(rgba(15,23,42,0.78),
  rgba(15,23,42,0.85)),
  url('./archi2.webp');

  background-size:cover;
  background-position:center;
  z-index:-2;
}

body::after{
  content:"";
  position:absolute;
  width:700px;
  height:700px;
  background:radial-gradient(circle,
  rgba(37,99,235,0.25),
  transparent 70%);
  z-index:-1;
  animation:floatGlow 6s ease-in-out infinite;
}

@keyframes floatGlow{

  0%{
    transform:translateY(-20px);
  }

  50%{
    transform:translateY(20px);
  }

  100%{
    transform:translateY(-20px);
  }

}

/* =========================
   MAIN CARD
========================= */

.error-container{
  width:92%;
  max-width:700px;
  padding:55px 45px;
  border-radius:35px;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.12);

  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);

  text-align:center;
  color:#fff;

  box-shadow:
  0 20px 50px rgba(0,0,0,0.45);

  position:relative;
  overflow:hidden;
}

/* =========================
   DECORATION
========================= */

.error-container::before{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  background:rgba(96,165,250,0.12);
  border-radius:50%;
  top:-90px;
  right:-90px;
}

.error-container::after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  background:rgba(37,99,235,0.15);
  border-radius:50%;
  bottom:-70px;
  left:-70px;
}

/* =========================
   LOGO
========================= */

.logo{
  margin-bottom:30px;
}

.logo img{
  height:65px;
}

/* =========================
   ERROR CODE
========================= */

.error-code{
  font-size:150px;
  font-weight:800;
  line-height:1;
  margin-bottom:10px;

  background:linear-gradient(135deg,#60a5fa,#2563eb,#93c5fd);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
  0 0 25px rgba(96,165,250,0.35);
}

/* =========================
   TEXT
========================= */

.error-title{
  font-size:42px;
  font-weight:700;
  margin-bottom:18px;
}

.error-desc{
  font-size:16px;
  line-height:1.9;
  color:rgba(255,255,255,0.82);
  max-width:520px;
  margin:auto auto 35px;
}

/* =========================
   INFO BADGE
========================= */

.info-badge{
  display:inline-flex;
  align-items:center;
  gap:10px;

  padding:12px 22px;
  border-radius:50px;

  background:rgba(37,99,235,0.18);

  border:1px solid rgba(96,165,250,0.25);

  color:#bfdbfe;

  font-size:14px;
  margin-bottom:30px;
}

/* =========================
   BUTTON
========================= */

.button-group{
  display:flex;
  justify-content:center;
  margin-top:10px;
}

.home-btn{
  text-decoration:none;
  padding:16px 38px;
  border-radius:60px;

  background:linear-gradient(135deg,#2563eb,#60a5fa);

  color:#fff;
  font-weight:600;
  font-size:16px;

  display:inline-flex;
  align-items:center;
  gap:12px;

  transition:0.35s;
  box-shadow:
  0 10px 25px rgba(37,99,235,0.35);
}

.home-btn:hover{
  transform:translateY(-4px) scale(1.03);

  box-shadow:
  0 18px 35px rgba(37,99,235,0.45);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

  .error-container{
    padding:45px 25px;
    border-radius:28px;
  }

  .error-code{
    font-size:110px;
  }

  .error-title{
    font-size:32px;
  }

  .error-desc{
    font-size:15px;
    line-height:1.8;
  }

  .home-btn{
    width:100%;
    justify-content:center;
  }

}

@media(max-width:500px){

  .error-code{
    font-size:85px;
  }

  .error-title{
    font-size:25px;
  }

  .error-desc{
    font-size:14px;
  }

  .info-badge{
    font-size:13px;
    padding:10px 18px;
  }

}

</style>
</head>
<body>

<!-- =========================
     404 CARD
========================= -->

<div class="error-container">

  <!-- LOGO -->

  <div class="logo">

    <!-- CHANGE YOUR LOGO -->
    <img src="./white.webp" alt="StacklyEstate Logo">

  </div>

  <!-- ERROR -->

  <h1 class="error-code">
    404
  </h1>

  <h2 class="error-title">
    Oops! Property Not Found
  </h2>

  <!-- BADGE -->

  <div class="info-badge">

    <i class="fa-solid fa-house-circle-exclamation"></i>

    The property page you are looking for does not exist

  </div>

  <!-- DESCRIPTION -->

  <p class="error-desc">

    The listing may have been removed, sold out,
    or the page link may be incorrect.
    Explore premium real estate properties,
    apartments, villas, and commercial spaces
    from the StacklyEstate dashboard.

  </p>

  <!-- BUTTON -->

  <div class="button-group">

    <a href="./index.html" class="home-btn">

      <i class="fa-solid fa-house"></i>

      Back To Home

    </a>

  </div>

</div>

</body>
</html>
