<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>404 - StacklyEstate</title>

<!-- GOOGLE FONT -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- FONT AWESOME -->
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

<style>

/* =========================
   GLOBAL
========================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Poppins',sans-serif;
}

body{
  min-height:100vh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#0f172a;
  padding:20px;
}

/* =========================
   BACKGROUND IMAGE
========================= */

body::before{
  content:"";
  position:absolute;
  inset:0;

  background:
  linear-gradient(rgba(15,23,42,0.82),
  rgba(15,23,42,0.88)),
  url('./archi2.webp');

  background-size:cover;
  background-position:center;
  z-index:-2;
}

body::after{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  background:radial-gradient(circle,
  rgba(37,99,235,0.22),
  transparent 70%);
  z-index:-1;
  animation:floatGlow 6s ease-in-out infinite;
}

@keyframes floatGlow{

  0%{
    transform:translateY(-15px);
  }

  50%{
    transform:translateY(15px);
  }

  100%{
    transform:translateY(-15px);
  }

}

/* =========================
   MAIN CARD
========================= */

.error-container{
  width:100%;
  max-width:520px;

  padding:35px 28px;

  border-radius:28px;

  background:rgba(255,255,255,0.08);

  border:1px solid rgba(255,255,255,0.10);

  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);

  text-align:center;
  color:#fff;

  box-shadow:
  0 15px 40px rgba(0,0,0,0.4);

  position:relative;
  overflow:hidden;
}

/* =========================
   DECORATION
========================= */

.error-container::before{
  content:"";
  position:absolute;
  width:160px;
  height:160px;
  background:rgba(96,165,250,0.10);
  border-radius:50%;
  top:-70px;
  right:-70px;
}

.error-container::after{
  content:"";
  position:absolute;
  width:140px;
  height:140px;
  background:rgba(37,99,235,0.12);
  border-radius:50%;
  bottom:-60px;
  left:-60px;
}

/* =========================
   LOGO
========================= */

.logo{
  margin-bottom:18px;
}

.logo img{
  height:52px;
}

/* =========================
   ERROR CODE
========================= */

.error-code{
  font-size:100px;
  font-weight:800;
  line-height:1;
  margin-bottom:8px;

  background:linear-gradient(135deg,#60a5fa,#2563eb,#93c5fd);

  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;

  text-shadow:
  0 0 20px rgba(96,165,250,0.25);
}

/* =========================
   TEXT
========================= */

.error-title{
  font-size:28px;
  font-weight:700;
  margin-bottom:14px;
}

.error-desc{
  font-size:14px;
  line-height:1.8;
  color:rgba(255,255,255,0.78);
  max-width:420px;
  margin:auto auto 24px;
}

/* =========================
   INFO BADGE
========================= */

.info-badge{
  display:inline-flex;
  align-items:center;
  gap:8px;

  padding:10px 18px;
  border-radius:50px;

  background:rgba(37,99,235,0.15);

  border:1px solid rgba(96,165,250,0.20);

  color:#bfdbfe;

  font-size:13px;
  margin-bottom:22px;
}

/* =========================
   BUTTON
========================= */

.button-group{
  display:flex;
  justify-content:center;
}

.home-btn{
  text-decoration:none;
  padding:14px 28px;
  border-radius:50px;

  background:linear-gradient(135deg,#2563eb,#60a5fa);

  color:#fff;
  font-weight:600;
  font-size:15px;

  display:inline-flex;
  align-items:center;
  gap:10px;

  transition:0.35s;

  box-shadow:
  0 10px 22px rgba(37,99,235,0.30);
}

.home-btn:hover{
  transform:translateY(-3px);

  box-shadow:
  0 15px 30px rgba(37,99,235,0.40);
}

/* =========================
   RESPONSIVE
========================= */

@media(max-width:768px){

  .error-container{
    max-width:440px;
    padding:30px 22px;
  }

  .error-code{
    font-size:80px;
  }

  .error-title{
    font-size:24px;
  }

  .error-desc{
    font-size:13px;
  }

}

@media(max-width:500px){

  body{
    padding:15px;
  }

  .error-container{
    padding:26px 18px;
    border-radius:24px;
  }

  .logo img{
    height:45px;
  }

  .error-code{
    font-size:65px;
  }

  .error-title{
    font-size:20px;
  }

  .error-desc{
    font-size:12px;
    line-height:1.7;
  }

  .info-badge{
    width:100%;
    justify-content:center;
    font-size:12px;
    padding:10px 14px;
  }

  .home-btn{
    width:100%;
    justify-content:center;
    font-size:14px;
    padding:13px 20px;
  }

}

</style>
</head>

<body>

<!-- =========================
     404 CARD
========================= -->

<div class="error-container">

  <!-- LOGO -->

  <div class="logo">

    <img src="./white.webp" alt="StacklyEstate Logo">

  </div>

  <!-- ERROR -->

  <h1 class="error-code">
    404
  </h1>

  <h2 class="error-title">
    Property Not Found
  </h2>

  <!-- BADGE -->

  <div class="info-badge">

    <i class="fa-solid fa-house-circle-exclamation"></i>

    Requested property page unavailable

  </div>

  <!-- DESCRIPTION -->

  <p class="error-desc">

    The page you are trying to access may have been removed,
    sold out, or the URL might be incorrect.
    Return to the StacklyEstate homepage to continue exploring properties.

  </p>

  <!-- BUTTON -->

  <div class="button-group">

    <a href="./index.html" class="home-btn">

      <i class="fa-solid fa-house"></i>

      Back To Home

    </a>

  </div>

</div>

</body>
</html>
